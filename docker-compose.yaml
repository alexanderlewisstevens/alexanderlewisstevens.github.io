services:
  jekyll-site:
    image: jekyll-site
    build:
      context: .
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app:cached
    ports:
      - "4000:4000"
    environment:
      JEKYLL_ENV: docker
    command:
      - bundle
      - exec
      - jekyll
      - serve
      - -H
      - 0.0.0.0
      - -P
      - "4000"
      - -w
      - --force_polling
      - --config
      - _config.yml,_config_docker.yml
